<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Gohan SSJ2 Awakening</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
#dialog{
 position:absolute; bottom:5%; left:5%; width:90%;
 padding:12px;
 background:rgba(0,0,0,.78);
 color:#fff; font-size:16px;
 border:1px solid #fff;
 display:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dialog"></div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const dialog=document.getElementById('dialog');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener('resize',resize);resize();

let cut=0;
const cx=()=>canvas.width/2;
const cy=()=>canvas.height*0.6;

// =================== GOHAN (정밀 재설계) ===================
function drawGohan(ssj2=false){
 // --- GI ---
 ctx.fillStyle='#5a2c83';
 ctx.fillRect(cx()-28,cy()-92,56,64);

 // folds
 ctx.fillStyle='rgba(0,0,0,.15)';
 ctx.fillRect(cx()-4,cy()-92,4,64);

 // belt
 ctx.fillStyle='#2c6fd6';
 ctx.fillRect(cx()-32,cy()-28,64,12);

 // pants
 ctx.fillStyle='#5a2c83';
 ctx.fillRect(cx()-26,cy()-16,22,48);
 ctx.fillRect(cx()+4,cy()-16,22,48);

 // boots
 ctx.fillStyle='#e0c28b';
 ctx.fillRect(cx()-28,cy()+32,24,12);
 ctx.fillRect(cx()+4,cy()+32,24,12);
 ctx.fillStyle='#1f4fb8';
 ctx.fillRect(cx()-28,cy()+44,24,8);
 ctx.fillRect(cx()+4,cy()+44,24,8);

 // --- HEAD ---
 ctx.beginPath();
 ctx.ellipse(cx(),cy()-110,18,22,0,0,Math.PI*2);
 ctx.fillStyle='#f1c27d'; ctx.fill();

 // eyebrows
 ctx.strokeStyle='#000'; ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(cx()-12,cy()-120); ctx.lineTo(cx()-2,cy()-122);
 ctx.moveTo(cx()+2,cy()-122); ctx.lineTo(cx()+12,cy()-120);
 ctx.stroke();

 // eyes
 ctx.fillStyle='#000';
 ctx.fillRect(cx()-7,cy()-110,3,3);
 ctx.fillRect(cx()+4,cy()-110,3,3);

 // mouth
 ctx.beginPath();
 ctx.moveTo(cx()-5,cy()-98);
 ctx.lineTo(cx()+5,cy()-98);
 ctx.stroke();

 // --- HAIR ---
 ctx.fillStyle=ssj2?'#ffd700':'#111';
 const spikes=ssj2?
 [[-28,24,-6,-52,8,24],[0,24,4,-72,16,24],[14,24,30,-46,42,30]]
 :
 [[-20,18,-6,-40,8,18],[12,18,22,-34,32,22]];
 spikes.forEach(s=>{
  ctx.beginPath();
  ctx.moveTo(cx()+s[0],cy()-110+s[1]);
  ctx.lineTo(cx()+s[2],cy()-110+s[3]);
  ctx.lineTo(cx()+s[4],cy()-110+s[5]);
  ctx.closePath(); ctx.fill();
 });
}

// =================== CELL (셀 완전체 스타일) ===================
function drawCell(){
 // body
 ctx.fillStyle='#2e7f3f';
 ctx.fillRect(cx()+120,cy()-100,46,96);

 // chest pattern
 ctx.fillStyle='#111';
 ctx.fillRect(cx()+128,cy()-90,30,40);

 // head
 ctx.fillStyle='#000';
 ctx.fillRect(cx()+120,cy()-130,46,30);

 // eyes
 ctx.fillStyle='#fff';
 ctx.fillRect(cx()+132,cy()-120,4,4);
 ctx.fillRect(cx()+148,cy()-120,4,4);

 // tail hint
 ctx.strokeStyle='#2e7f3f';
 ctx.beginPath();
 ctx.moveTo(cx()+166,cy()-40);
 ctx.lineTo(cx()+200,cy());
 ctx.stroke();
}

// =================== ANDROID 16 ===================
function draw16(broken=false){
 // body
 ctx.fillStyle='#4c7a3d';
 ctx.fillRect(cx()-150,cy()-72,40,72);

 // shoulder pads
 ctx.fillStyle='#6aa84f';
 ctx.fillRect(cx()-154,cy()-76,20,16);
 ctx.fillRect(cx()-110,cy()-76,20,16);

 // head
 ctx.beginPath();
 ctx.arc(cx()-130,cy()-94,18,0,Math.PI*2);
 ctx.fillStyle='#d28c3c'; ctx.fill();

 // face
 ctx.fillStyle='#000';
 ctx.fillRect(cx()-136,cy()-96,4,4);
 ctx.fillRect(cx()-124,cy()-96,4,4);

 if(broken){
  ctx.fillStyle='#555';
  for(let i=0;i<14;i++){
   ctx.fillRect(cx()-160+Math.random()*60,cy()-40+Math.random()*40,4,4);
  }
 }
}

// =================== RED LIGHTNING ===================
function redLightning(){
 for(let i=0;i<8;i++){
  ctx.strokeStyle='rgba(255,0,0,0.85)';
  ctx.beginPath();
  let x=cx(),y=cy()-110;
  ctx.moveTo(x,y);
  for(let j=0;j<6;j++){
   x+=Math.random()*36-18;
   y+=Math.random()*38;
   ctx.lineTo(x,y);
  }
  ctx.stroke();
 }
}

// =================== RENDER ===================
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=cut>=9?'#330000':'#2b2b2b';
 ctx.fillRect(0,0,canvas.width,canvas.height);

 dialog.style.display='none';

 if(cut<6) draw16(cut>=6);
 if(cut>=6) drawCell();
 if(cut>=1) drawGohan(cut>=10);
 if(cut>=9) redLightning();

 const texts=[
  null,
  "내가 좋아했던 ",
  "자연과 동물들을",
  "지.켜.주.거.라. ",
  "부탁한다~ ",
  null,
  "쓸데없는 참견이다 \n실패작 녀석 ",
  null,
  null,
  null,
  null,
  "드디어 \n오반의 분노의 한계가 넘은 것인가? "
 ];
 if(texts[cut]){
  dialog.style.display='block';
  dialog.innerText=texts[cut];
 }
}

render();
addEventListener('click',()=>{cut=Math.min(cut+1,11);render();});
addEventListener('touchstart',()=>{cut=Math.min(cut+1,11);render();});
</script>
</body>
</html>
