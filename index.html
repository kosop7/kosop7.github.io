<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gohan SSJ2 Awakening</title>

<style>
html,body{
  margin:0; padding:0;
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
}
#scene{
  position:relative;
  width:100vw;
  height:100vh;
}
.sky{
  position:absolute;
  inset:0;
  background:linear-gradient(#222,#000);
  transition:background 1.5s;
}
.sky.red{
  background:linear-gradient(#5a0000,#120000);
}

/* ===== 공통 캐릭터 ===== */
.character{
  position:absolute;
  bottom:10%;
  transform:translateX(-50%);
}

/* ===== 손오반 ===== */
#gohan{
  left:50%;
  width:160px;
  height:320px;
  opacity:0;
}
#gohan .hair{
  position:absolute;
  top:-50px; left:10px;
  width:140px; height:100px;
  display:flex; justify-content:space-between;
}
#gohan .hair span{
  width:22px; height:100px;
  background:linear-gradient(#fff176,#fbc02d);
  clip-path:polygon(50% 0,0 100%,100% 100%);
}
#gohan .head{
  position:absolute;
  top:40px; left:30px;
  width:100px; height:110px;
  background:#f1c27d;
}
.eye{position:absolute;top:40px;width:12px;height:16px;background:#000;}
.eye.left{left:20px;} .eye.right{right:20px;}
.brow{position:absolute;top:20px;width:30px;height:6px;background:#000;}
.brow.left{left:10px;} .brow.right{right:10px;}
.mouth{position:absolute;bottom:18px;left:30px;width:40px;height:6px;background:#000;}
.torso{
  position:absolute;
  top:150px; left:40px;
  width:80px; height:90px;
  background:#6a1b9a;
}
.arm{
  position:absolute; top:150px;
  width:20px; height:80px;
  background:#f1c27d;
}
.arm.left{left:15px;} .arm.right{right:15px;}
.leg{
  position:absolute; bottom:0;
  width:25px; height:80px;
  background:#311b92;
}
.leg.left{left:45px;} .leg.right{right:45px;}

/* 오라 */
#aura{
  position:absolute;
  inset:-40px;
  background:radial-gradient(circle,rgba(255,0,0,.6),transparent 70%);
  opacity:0;
  animation:pulse .4s infinite alternate;
}
@keyframes pulse{to{transform:scale(1.1);}}

/* ===== 셀 ===== */
#cell{
  left:65%;
  width:160px;
  height:320px;
}
.cell-head{
  width:90px;height:80px;
  background:#558b2f;
  margin:auto;
}
.cell-body{
  width:140px;height:180px;
  margin:auto;
  background:
    radial-gradient(#000 15%,transparent 16%) 0 0/20px 20px,
    #7cb342;
}
/* 셀 발 */
#cell-foot{
  position:absolute;
  bottom:0; left:40px;
  width:80px; height:30px;
  background:#2e7d32;
  transform:translateY(-200px);
}

/* ===== 16호 ===== */
#android16{
  left:35%;
  width:180px;
  height:280px;
}
.head16{
  width:100px;height:60px;
  background:#ff7043;
  margin:auto;
}
.torso16{
  width:140px;height:140px;
  background:#2e7d32;
  margin:auto;
}
.arm16{
  position:absolute;top:80px;
  width:25px;height:120px;
  background:#b0bec5;
}
.arm16.left{left:-20px;}
.arm16.right{right:-20px;}

/* 파편 */
.fragment{
  position:absolute;
  width:10px;height:10px;
  background:#999;
  animation:fall 1s forwards;
}
@keyframes fall{
  to{transform:translateY(300px) rotate(360deg);opacity:0;}
}

/* ===== 관전자 ===== */
#watchers{
  position:absolute;
  right:5%; bottom:12%;
  display:flex; gap:10px;
}
.watcher{
  width:40px;height:80px;
  opacity:.6;
}
.vegeta{background:#1a237e;}
.piccolo{background:#2e7d32;}
.goku{background:#ef6c00;}
.krillin{background:#fbc02d;}

/* ===== 붉은 번개 ===== */
.lightning{
  position:absolute;
  width:3px;height:120px;
  background:red;
  animation:zap .15s infinite;
}
@keyframes zap{50%{opacity:0;}}

/* ===== 자막 ===== */
#subtitle{
  position:absolute;
  bottom:0;
  width:100%;
  min-height:80px;
  background:rgba(0,0,0,.7);
  color:#fff;
  padding:15px;
  display:none;
}
#tap{
  position:absolute;
  bottom:90px;
  width:100%;
  text-align:center;
  color:#aaa;
}
</style>
</head>

<body>
<div id="scene">
  <div class="sky" id="sky"></div>

  <!-- 16호 -->
  <div class="character" id="android16">
    <div class="head16"></div>
    <div class="torso16"></div>
    <div class="arm16 left"></div>
    <div class="arm16 right"></div>
  </div>

  <!-- 셀 -->
  <div class="character" id="cell">
    <div class="cell-head"></div>
    <div class="cell-body"></div>
    <div id="cell-foot"></div>
  </div>

  <!-- 손오반 -->
  <div class="character" id="gohan">
    <div id="aura"></div>
    <div class="hair"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="head">
      <div class="brow left"></div><div class="brow right"></div>
      <div class="eye left"></div><div class="eye right"></div>
      <div class="mouth"></div>
    </div>
    <div class="torso"></div>
    <div class="arm left"></div><div class="arm right"></div>
    <div class="leg left"></div><div class="leg right"></div>
  </div>

  <!-- 관전자 -->
  <div id="watchers">
    <div class="watcher vegeta"></div>
    <div class="watcher piccolo"></div>
    <div class="watcher goku"></div>
    <div class="watcher krillin"></div>
  </div>

  <div id="subtitle"></div>
  <div id="tap">TAP</div>
</div>

<script>
const subtitle=document.getElementById("subtitle");
const sky=document.getElementById("sky");
const aura=document.getElementById("aura");
const gohan=document.getElementById("gohan");
const foot=document.getElementById("cell-foot");
const android16=document.getElementById("android16");
const scene=document.getElementById("scene");

function show(text){
  subtitle.style.display="block";
  subtitle.textContent="";
  let i=0;
  const t=setInterval(()=>{
    subtitle.textContent+=text[i++];
    if(i>=text.length) clearInterval(t);
  },40);
}
function hide(){subtitle.style.display="none";}

const scenes=[
  ()=>{},
  ()=>show("오반 "),
  ()=>show("내가 좋아했던 "),
  ()=>show("자연과 동물들을"),
  ()=>show("지.켜.주.거.라. "),
  ()=>show("부탁한다~ "),
  ()=>{
    hide();
    foot.style.transition="transform .3s";
    foot.style.transform="translateY(0)";
    setTimeout(()=>{
      android16.style.transform="scaleY(.2)";
      for(let i=0;i<15;i++){
        const f=document.createElement("div");
        f.className="fragment";
        f.style.left=Math.random()*window.innerWidth+"px";
        f.style.top="50%";
        scene.appendChild(f);
      }
      setTimeout(()=>android16.remove(),300);
    },300);
  },
  ()=>show("쓸데없는 참견이다 "),
  ()=>{
    show("실패작 녀석 ");
    sky.classList.add("red");
  },
  ()=>{
    hide();
    gohan.style.opacity=1;
  },
  ()=>{
    aura.style.opacity=1;
    for(let i=0;i<6;i++){
      const l=document.createElement("div");
      l.className="lightning";
      l.style.left=45+Math.random()*60+"%";
      l.style.top="20%";
      scene.appendChild(l);
    }
  },
  ()=>show("드디어 "),
  ()=>show("오반의 분노의 한계가 넘은 것인가? ")
];

let idx=0;
function next(){
  if(idx<scenes.length) scenes[idx++]();
}
document.body.addEventListener("click",next);
document.body.addEventListener("touchstart",next);
</script>
</body>
</html>
