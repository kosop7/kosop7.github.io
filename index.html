<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>새 도감</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: "Noto Serif KR", serif;
  height: 100%;
}

#book-stage {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

#book {
  width: 900px;
  height: 560px;
  display: flex;
  background: #4a3628;
  padding: 14px;
  border-radius: 6px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}

.page {
  width: 50%;
  background: #fbf8f2;
  padding: 26px;
  box-sizing: border-box;
  overflow: hidden;
}

.page.left { border-right: 1px solid #d6cfc4; }
.page.right { border-left: 1px solid #d6cfc4; }

.cover {
  background: #4a3628;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.cover h1 {
  font-size: 30px;
}

.title {
  font-size: 22px;
  font-weight: bold;
  color: #3b2a1a;
}

.sci {
  font-style: italic;
  font-size: 14px;
  color: #6b5a4a;
  margin-bottom: 14px;
}

.desc {
  font-size: 15px;
  line-height: 1.7;
  color: #3b2a1a;
}

.photo-full {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 1px solid #b6a999;
}

#nav {
  margin-top: 16px;
}

#nav button {
  background: none;
  border: none;
  font-size: 28px;
  margin: 0 24px;
  cursor: pointer;
  color: #4a3628;
  opacity: 0.55;
}

#nav button:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div id="book-stage">
  <div id="book"></div>

  <div id="nav">
    <button onclick="prev()">‹</button>
    <button onclick="next()">›</button>
  </div>
</div>

<script>
const data = [
  { type: "cover" },

  {
    id: "sparrow",
    name: "참새",
    sci: "Passer montanus",
    desc: `
참새는 참새목 참새과에 속하는 소형 조류로,
사람이 사는 곳 가까이에서 가장 흔히 볼 수 있는 텃새이다.

몸길이는 약 14cm이며 갈색 깃털과
뺨의 검은 반점이 특징이다.
곡식과 풀씨를 주로 먹지만
번식기에는 해충도 잡아먹는다.
`
  }
];

let index = 0;
const book = document.getElementById("book");

function render() {
  book.innerHTML = "";
  book.append(makePage(data[index], "left"));
  book.append(makePage(data[index + 1], "right"));
}

function makePage(d, side) {
  const p = document.createElement("div");
  p.className = `page ${side}`;

  if (!d) return p;

  if (d.type === "cover") {
    p.classList.add("cover");
    p.innerHTML = "<h1>새 도감</h1>";
    return p;
  }

  /* 참새 페이지 */
  if (side === "left") {
    p.innerHTML = `
      <div class="title">${d.name}</div>
      <div class="sci">${d.sci}</div>
      <div class="desc">${d.desc}</div>
      <img src="assets/images/b1.jpg" class="photo-full" style="margin-top:12px;">
    `;
  } else {
    p.innerHTML = `
      <img src="assets/images/b2.jpg" class="photo-full">
      <div class="desc" style="margin-top:12px;">
        <audio controls style="width:100%;">
          <source src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Passer_montanus.ogg" type="audio/ogg">
        </audio>
      </div>
    `;
  }

  return p;
}

function next() {
  if (index < data.length - 2) {
    index += 2;
    render();
  }
}

function prev() {
  if (index > 0) {
    index -= 2;
    render();
  }
}

render();
</script>

</body>
</html>
