---
layout: page
title: Home
---


/* POSTS */
.c-archives {
  max-width: 720px;
  margin: 80px auto;
  padding: 0 20px;
}
</style>
</head>

<body>

<section class="game-wrap">
  <div style="position:relative;">
    <canvas id="game"></canvas>
    <div id="score" class="ui">0</div>
    <div id="over" class="ui">
      GAME OVER<br>
      <small>START 버튼으로 재시작</small>
    </div>
  </div>
  <button id="startBtn">START</button>
</section>

<section class="c-archives">
  <ul class="c-archives__list">
    {% for post in site.posts %}
      <li class="c-archives__item">
        <h3>
          <a href="{{ post.url | prepend: site.baseurl }}">
            {{ post.title }}
          </a>
        </h3>
      </li>
    {% endfor %}
  </ul>
</section>

<script>
/* ===== Canvas ===== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  const w = Math.min(window.innerWidth, 520);
  const h = Math.min(window.innerHeight * 0.85, 680);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = w * DPR;
  canvas.height = h * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ===== GAME CONST ===== */
const GRAVITY = 0.45;
const FLAP = -8.5;
const PIPE_GAP = 160;
const PIPE_W = 60;
const PIPE_SPEED = 1.9;
const GROUND_H = 90;

/* ===== STATE ===== */
let active = false;
let running = false;
let gameOver = false;
let score = 0;

const bird = {
  x: 100,
  y: canvas.height / DPR / 2,
  r: 14,
  vy: 0,
  rot: 0
};

let pipes = [];
let spawnTimer = 0;

/* ===== UI ===== */
const scoreEl = document.getElementById('score');
const overEl = document.getElementById('over');
const startBtn = document.getElementById('startBtn');

/* ===== INPUT ===== */
function enableInput() {
  window.addEventListener('keydown', onKey);
  canvas.addEventListener('mousedown', flap);
  canvas.addEventListener('touchstart', onTouch, { passive: false });
}
function disableInput() {
  window.removeEventListener('keydown', onKey);
  canvas.removeEventListener('mousedown', flap);
  canvas.removeEventListener('touchstart', onTouch);
}
function onKey(e) { if (e.code === 'Space') flap(); }
function onTouch(e) { e.preventDefault(); flap(); }

/* ===== GAME ===== */
function flap() {
  if (!running) return;
  bird.vy = FLAP;
}

function reset() {
  gameOver = false;
  running = true;
  score = 0;
  scoreEl.textContent = score;
  scoreEl.style.display = 'block';
  overEl.style.display = 'none';
  bird.y = canvas.height / DPR / 2;
  bird.vy = 0;
  pipes = [];
  spawnTimer = 0;
}

startBtn.onclick = () => {
  active = true;
  reset();
  enableInput();
};

/* ===== UTILS ===== */
const rand = (a,b)=>Math.random()*(b-a)+a;

function addPipe() {
  pipes.push({
    x: canvas.width / DPR + 40,
    gapY: rand(140, canvas.height / DPR - GROUND_H - 140),
    passed: false
  });
}

function collide(p) {
  const m = 6;
  const top = p.gapY - PIPE_GAP/2;
  const bot = p.gapY + PIPE_GAP/2;
  if (bird.x + bird.r > p.x + m && bird.x - bird.r < p.x + PIPE_W - m) {
    if (bird.y - bird.r < top + m || bird.y + bird.r > bot - m) return true;
  }
  return false;
}

/* ===== DRAW ===== */
function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  /* body */
  ctx.fillStyle = '#ffdf3a';
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();

  /* eye */
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(-4, -4, 2.5, 0, Math.PI * 2);
  ctx.fill();

  /* eye shine */
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-3, -5, 1, 0, Math.PI * 2);
  ctx.fill();

  /* beak */
  ctx.fillStyle = '#ff9f1a';
  ctx.beginPath();
  ctx.moveTo(bird.r - 2, 0);
  ctx.lineTo(bird.r + 8, -4);
  ctx.lineTo(bird.r + 8, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawPipes() {
  ctx.fillStyle = '#2ecc71';
  pipes.forEach(p=>{
    const t = p.gapY - PIPE_GAP/2;
    const b = p.gapY + PIPE_GAP/2;
    ctx.fillRect(p.x,0,PIPE_W,t);
    ctx.fillRect(p.x,b,PIPE_W,canvas.height/DPR-b-GROUND_H);
  });
}

function drawGround() {
  ctx.fillStyle = '#eee';
  ctx.fillRect(0,canvas.height/DPR-GROUND_H,canvas.width/DPR,GROUND_H);
}

/* ===== LOOP ===== */
function update() {
  if (!running) return;

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.max(-0.4, Math.min(1.2, bird.vy/12));

  if (bird.y < 4 || bird.y > canvas.height/DPR-GROUND_H-4) gameOver = true;

  spawnTimer++;
  if (spawnTimer > 120) {
    addPipe();
    spawnTimer = 0;
  }

  pipes.forEach(p=>{
    p.x -= PIPE_SPEED;
    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }
    if (collide(p)) gameOver = true;
  });

  pipes = pipes.filter(p=>p.x+PIPE_W>-20);

  if (gameOver) {
    running = false;
    overEl.style.display = 'block';
    disableInput();
  }
}

function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPipes();
  drawGround();
  drawBird();
  if (active) update();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
