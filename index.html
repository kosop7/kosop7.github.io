<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SSJ2 Awakening – Scene 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0; padding:0;
  background:#000; color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
}
canvas{display:block}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
/* =====================
   BASIC SETUP
===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

const cx = ()=>canvas.width/2;
const groundY = ()=>canvas.height*0.7;

/* =====================
   SCENE STATE
===================== */
let t = 0;
let cameraZ = 1.25;        // 멀리서 시작
let cameraTargetZ = 1.05;  // 천천히 접근

/* =====================
   DUST PARTICLES
===================== */
const dust = [];
for(let i=0;i<120;i++){
  dust.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2+0.5,
    v: Math.random()*0.15+0.05
  });
}

/* =====================
   BACKGROUND
===================== */
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#0a0b1c');
  g.addColorStop(1,'#000');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

/* =====================
   ARENA (BROKEN)
===================== */
function drawBrokenArena(){
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(0, groundY(), canvas.width, canvas.height);

  ctx.strokeStyle='#333';
  ctx.lineWidth=2;

  for(let i=0;i<12;i++){
    ctx.beginPath();
    ctx.moveTo(Math.random()*canvas.width, groundY()+Math.random()*60);
    ctx.lineTo(Math.random()*canvas.width, groundY()+Math.random()*120);
    ctx.stroke();
  }
}

/* =====================
   FALLEN Z FIGHTERS
===================== */
function drawFallenFighters(){
  ctx.fillStyle='#0b0b0b';

  // 왼쪽
  ctx.save();
  ctx.translate(cx()-160, groundY()+20);
  ctx.rotate(-0.6);
  ctx.fillRect(-30,-6,60,12);
  ctx.restore();

  // 오른쪽
  ctx.save();
  ctx.translate(cx()+140, groundY()+30);
  ctx.rotate(0.4);
  ctx.fillRect(-28,-6,56,12);
  ctx.restore();
}

/* =====================
   DUST
===================== */
function drawDust(){
  ctx.fillStyle='rgba(255,255,255,.15)';
  dust.forEach(p=>{
    p.y -= p.v;
    if(p.y < 0) p.y = canvas.height;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
}

/* =====================
   GOHAN (BACK VIEW)
===================== */
function drawGohanBack(){
  const x = cx();
  const y = groundY()-40;

  // 상체
  ctx.fillStyle='#4f2a73';
  ctx.fillRect(x-22, y-60, 44, 54);

  // 허리띠
  ctx.fillStyle='#2c6fd6';
  ctx.fillRect(x-24, y-10, 48, 8);

  // 팔 (주먹 미세 떨림)
  const tremble = Math.sin(t*12)*1.2;

  ctx.fillStyle='#4f2a73';
  ctx.fillRect(x-36+tremble, y-54, 14, 38);
  ctx.fillRect(x+22-tremble, y-54, 14, 38);

  // 고개 숙인 머리
  ctx.beginPath();
  ctx.arc(x, y-70, 16, 0, Math.PI*2);
  ctx.fillStyle='#111';
  ctx.fill();
}

/* =====================
   UPDATE
===================== */
function update(){
  t += 0.016;

  // 카메라 천천히 접근
  cameraZ += (cameraTargetZ - cameraZ) * 0.002;
}

/* =====================
   RENDER
===================== */
function render(){
  ctx.save();

  ctx.translate(cx(), groundY());
  ctx.scale(cameraZ, cameraZ);
  ctx.translate(-cx(), -groundY());

  drawBackground();
  drawBrokenArena();
  drawFallenFighters();
  drawDust();
  drawGohanBack();

  ctx.restore();
}

/* =====================
   LOOP
===================== */
(function loop(){
  update();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
