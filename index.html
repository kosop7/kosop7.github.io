<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SSJ2 Awakening – Scene Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0; padding:0;
  background:#000; color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
}
canvas{display:block}

#ui{
  position:fixed;
  left:0; right:0; bottom:0;
  padding:12px;
  background:rgba(0,0,0,.65);
  display:flex;
  gap:12px;
  align-items:center;
}
button{
  background:#ffd700;
  border:0;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}

#dialogue{
  position:fixed;
  left:50%; bottom:80px;
  transform:translateX(-50%);
  width:80%;
  max-width:640px;
  padding:14px;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(255,255,255,.2);
}
#speaker{font-weight:700;margin-bottom:6px;}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="dialogue" style="display:none">
  <div id="speaker"></div>
  <div id="text"></div>
</div>

<div id="ui">
  <button id="power">각성</button>
  <div id="hint">SPACE / 버튼 → 진행</div>
</div>

<script>
/* =====================
   BASIC
===================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

const cx = ()=>canvas.width/2;
const cy = ()=>canvas.height*0.65;

let t=0, scene=1, sceneTime=0;
let energy=0, awakened=false, shake=0;

/* =====================
   CHAR STATE
===================== */
const CHAR = {
  GOHAN:{ eye:'down', blood:false, tear:false },
  A16:{ distortion:0, broken:false, debris:[] }
};

/* =====================
   DIALOGUE
===================== */
const dlg={active:false,speaker:'',text:'',shown:0};

function showDialogue(s,t){
  dlg.active=true; dlg.speaker=s; dlg.text=t; dlg.shown=0;
  dialogue.style.display='block';
}
function hideDialogue(){
  dlg.active=false;
  dialogue.style.display='none';
}

/* =====================
   INPUT
===================== */
power.onclick = advance;
addEventListener('keydown',e=>{
  if(e.code==='Space') advance();
});

function advance(){
  if(scene===6 && !awakened){
    energy=Math.min(100,energy+10);
    if(energy>=100) awakened=true;
    return;
  }
  scene++; sceneTime=0; hideDialogue();
}

/* =====================
   BACKGROUND
===================== */
function bg(){
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,scene<4?'#0a0b1c':'#300000');
  g.addColorStop(1,'#000');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

/* =====================
   EFFECTS
===================== */
function aura(){
  if(scene<6) return;
  const r=(awakened?150:80+energy);
  ctx.beginPath();
  ctx.arc(cx(),cy(),r,0,Math.PI*2);
  ctx.fillStyle=awakened?'rgba(255,215,0,.35)':'rgba(255,255,255,.15)';
  ctx.fill();
}
function lightning(){
  if(!awakened) return;
  ctx.strokeStyle='rgba(200,220,255,.9)';
  ctx.lineWidth=2;
  for(let k=0;k<3;k++){
    ctx.beginPath();
    let x=cx(),y=0;
    ctx.moveTo(x,y);
    while(y<canvas.height){
      x+=(Math.random()-.5)*40;
      y+=Math.random()*40+30;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

/* =====================
   GOHAN
===================== */
function drawGohanBody(){
  ctx.fillStyle='#5a2c83';
  ctx.fillRect(cx()-26,cy()-86,52,56);
  ctx.fillStyle='#2c6fd6';
  ctx.fillRect(cx()-28,cy()-34,56,10);
}
function drawGohanFace(){
  const x=cx(),y=cy()-98;
  ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2);
  ctx.fillStyle='#f1c27d'; ctx.fill();

  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  if(CHAR.GOHAN.eye==='down'){
    ctx.beginPath();
    ctx.moveTo(x-6,y-2); ctx.lineTo(x-2,y-2);
    ctx.moveTo(x+2,y-2); ctx.lineTo(x+6,y-2);
    ctx.stroke();
  }else{
    ctx.fillStyle='#000';
    ctx.fillRect(x-7,y-5,3,4);
    ctx.fillRect(x+4,y-5,3,4);
  }
  if(CHAR.GOHAN.blood){
    ctx.strokeStyle='#b00000';
    ctx.beginPath(); ctx.moveTo(x,y-14); ctx.lineTo(x-2,y+8);
    ctx.stroke();
  }
  if(CHAR.GOHAN.tear){
    ctx.fillStyle='rgba(200,220,255,.7)';
    ctx.beginPath(); ctx.arc(x-4,y+10,2,0,Math.PI*2);
    ctx.fill();
  }
}

/* 🔧 머리카락 살짝 위로 */
function drawHair(){
  ctx.fillStyle=awakened?'#ffd700':'#111';
  const baseY = cy()-122; // ⬅️ 기존 -118 → -122
  const spikes=[
    [-26,baseY+18,-6,baseY-30,6,baseY+18],
    [-10,baseY+16,0,baseY-40,10,baseY+16],
    [6,baseY+18,26,baseY-26,40,baseY+20]
  ];
  spikes.forEach(s=>{
    ctx.beginPath();
    ctx.moveTo(cx()+s[0],s[1]);
    ctx.lineTo(cx()+s[2],s[3]);
    ctx.lineTo(cx()+s[4],s[5]);
    ctx.closePath(); ctx.fill();
  });
}

/* =====================
   ANDROID 16
===================== */
function drawAndroid16(){
  if(CHAR.A16.broken){
    drawAndroid16HeadBreak();
    return;
  }
  const d=CHAR.A16.distortion;
  ctx.save();
  ctx.translate(cx(),cy()-110);
  ctx.rotate(d*0.03);
  ctx.scale(1+d*0.03,1-d*0.02);
  ctx.beginPath();
  ctx.arc(0,0,22,0,Math.PI*2);
  ctx.fillStyle='#d0b070'; ctx.fill();
  ctx.fillStyle='#000';
  ctx.fillRect(-8,-4,4,4);
  ctx.fillRect(4,-4,4,4);
  ctx.restore();
}

/* 🔧 머리 파괴 */
function drawAndroid16HeadBreak(){
  CHAR.A16.debris.forEach(p=>{
    p.vy+=0.3;
    p.y+=p.vy;
    ctx.fillStyle='#888';
    ctx.fillRect(p.x,p.y,4,4);
  });
}

/* =====================
   UPDATE
===================== */
function update(){
  t+=0.016; sceneTime+=0.016;

  if(scene===2){
    showDialogue('인조인간 16호','자연과 동물들을… 지켜주거라.');
    CHAR.A16.distortion+=0.01;
  }

  if(scene===3 && !CHAR.A16.broken){
    CHAR.A16.broken=true;
    for(let i=0;i<20;i++){
      CHAR.A16.debris.push({
        x:cx()+Math.random()*40-20,
        y:cy()-110,
        vy:Math.random()*-4
      });
    }
  }

  if(scene===4){
    CHAR.GOHAN.eye='shaking';
    CHAR.GOHAN.blood=true;
  }
  if(scene===5){
    CHAR.GOHAN.eye='focused';
    CHAR.GOHAN.tear=true;
  }
  if(scene>=6){
    shake=awakened?6:3;
  }
}

/* =====================
   RENDER
===================== */
function render(){
  ctx.save();
  if(shake) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  bg();
  if(scene<=3) drawAndroid16();
  drawGohanBody();
  drawGohanFace();
  drawHair();
  aura();
  lightning();

  ctx.restore();

  if(dlg.active){
    dlg.shown=Math.min(dlg.text.length,dlg.shown+1);
    speaker.innerText=dlg.speaker;
    text.innerText=dlg.text.slice(0,dlg.shown);
  }
}

/* =====================
   LOOP
===================== */
(function loop(){
  update();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
