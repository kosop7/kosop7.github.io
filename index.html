title: 새 도감

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>새 도감</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  font-family: "Noto Serif KR", serif;
  overflow: hidden;
}

#book-stage {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

#book {
  width: 900px;
  height: 560px;
  display: flex;
  background: #4a3628;
  padding: 14px;
  border-radius: 6px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}

.page {
  width: 50%;
  background: #fbf8f2;
  padding: 26px;
  box-sizing: border-box;
  overflow: hidden;
}

.page.left { border-right: 1px solid #d6cfc4; }
.page.right { border-left: 1px solid #d6cfc4; }

/* 표지 */
.cover {
  background: #4a3628;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 34px;
  letter-spacing: 2px;
}

/* 공통 텍스트 */
.title {
  font-size: 22px;
  font-weight: bold;
  color: #3b2a1a;
}

.sci {
  font-style: italic;
  font-size: 14px;
  color: #6b5a4a;
  margin-bottom: 14px;
}

.desc {
  font-size: 15px;
  line-height: 1.7;
  color: #3b2a1a;
  white-space: pre-line;
}

/* 빈 사진 페이지 */
.placeholder {
  width: 100%;
  height: 100%;
  border: 2px dashed #c8bfb3;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #9a8f82;
  font-size: 16px;
}

/* 참새 페이지 */
.full-photo {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border: 1px solid #b6a999;
  margin-top: 14px;
}

.audio {
  margin: 14px 0;
}

#nav {
  margin-top: 16px;
}

#nav button {
  background: none;
  border: none;
  font-size: 28px;
  margin: 0 24px;
  cursor: pointer;
  color: #4a3628;
  opacity: 0.55;
}

#nav button:hover { opacity: 1; }
</style>
</head>

<body>

<div id="book-stage">
  <div id="book"></div>

  <div id="nav">
    <button onclick="prev()">‹</button>
    <button onclick="next()">›</button>
  </div>
</div>

<script>
const data = [
  { type: "cover" },

  { type: "blank-photo" },

  { type: "guide" },

  {
    type: "sparrow",
    name: "참새",
    sci: "Passer montanus",
    desc: `
참새는 참새목 참새과에 속하는 소형 조류로,
한국 전역에서 매우 흔하게 관찰되는 텃새이다.

몸길이는 약 14cm이며,
머리에는 갈색과 검은색 무늬가 있고
뺨에 뚜렷한 검은 반점이 있는 것이 특징이다.

주로 곡식의 씨앗, 풀씨, 곤충을 먹고,
번식기에는 해충을 잡아먹어
인간 생활에 이로운 역할을 한다.

사람이 사는 마을, 논밭, 공원 등
인간 생활권에 잘 적응하여 살아간다.
`
  }
];

let index = 0;
const book = document.getElementById("book");

function render() {
  book.innerHTML = "";
  book.append(makePage(data[index], "left"));
  book.append(makePage(data[index + 1], "right"));
}

function makePage(d, side) {
  const p = document.createElement("div");
  p.className = `page ${side}`;
  if (!d) return p;

  if (d.type === "cover") {
    p.classList.add("cover");
    p.textContent = "새 도감";
    return p;
  }

  if (d.type === "blank-photo") {
    p.innerHTML = `<div class="placeholder">사진 추가 예정</div>`;
    return p;
  }

  if (d.type === "guide") {
    p.innerHTML = `<div class="title">만나면 채워짐</div>`;
    return p;
  }

  if (d.type === "sparrow") {
    p.innerHTML = `
      <div class="title">${d.name}</div>
      <div class="sci">${d.sci}</div>
      <div class="desc">${d.desc}</div>

      <div class="audio">
        <strong>울음소리</strong><br>
        <audio controls style="width:100%; margin-top:6px;">
          <source src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Passer_montanus.ogg" type="audio/ogg">
        </audio>
      </div>

      <img src="assets/images/b2.jpg" class="full-photo" alt="참새 사진">
    `;
    return p;
  }

  return p;
}

function next() {
  if (index < data.length - 2) {
    index += 2;
    render();
  }
}

function prev() {
  if (index > 0) {
    index -= 2;
    render();
  }
}

render();
</script>

</body>
</html>
