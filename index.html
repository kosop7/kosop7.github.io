<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Dragon Ball – Full Body Neutral Study</title>
<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
}
canvas{
  display:block;
  margin:20px auto;
  background:linear-gradient(#060606,#0c0c0c);
  border-radius:18px;
  box-shadow:0 0 60px rgba(0,200,150,.15);
}
</style>
</head>
<body>

<canvas id="c" width="1600" height="950"></canvas>

<script>
const ctx = c.getContext("2d");

/* ===== BASIC SHAPES ===== */
function circle(x,y,r,c){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=c; ctx.fill();
}
function rect(x,y,w,h,c){
  ctx.fillStyle=c; ctx.fillRect(x,y,w,h);
}

/* ===== FACE (NEUTRAL) ===== */
function face(x,y,skin){
  circle(x,y,52,skin);

  // eyes
  rect(x-18,y-6,12,6,"#000");
  rect(x+6,y-6,12,6,"#000");

  // nose
  rect(x-2,y+4,4,10,"rgba(0,0,0,.25)");

  // mouth (neutral)
  rect(x-10,y+24,20,3,"#000");
}

/* ===== LIMBS ===== */
function arms(x,y,skin){
  rect(x-80,y+70,28,110,skin);
  rect(x+52,y+70,28,110,skin);
}
function legs(x,y,pants){
  rect(x-28,y+220,26,130,pants);
  rect(x+2,y+220,26,130,pants);
}

/* ===== GOHAN ===== */
function gohan(x,y){
  arms(x,y,"#f2c9a5");
  legs(x,y,"#3c245f");

  // hair
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.moveTo(x-60,y-20);
  ctx.lineTo(x-25,y-115);
  ctx.lineTo(x,y-70);
  ctx.lineTo(x+25,y-120);
  ctx.lineTo(x+60,y-20);
  ctx.closePath(); ctx.fill();

  face(x,y,"#f2c9a5");

  // gi
  rect(x-45,y+55,90,170,"#5b3a8e");
  rect(x-45,y+125,90,12,"#2b1a45");
}

/* ===== ANDROID 16 ===== */
function a16(x,y){
  arms(x,y,"#e8e8e8");
  legs(x,y,"#1e1e1e");

  // hair (mechanical)
  rect(x-60,y-95,120,32,"#ff7a00");

  face(x,y,"#e8e8e8");

  // armor
  rect(x-55,y+55,110,180,"#4f6f2f");
  rect(x-55,y+135,110,14,"#111");
}

/* ===== CELL ===== */
function cell(x,y){
  arms(x,y,"#3d7a4f");
  legs(x,y,"#2e5c3e");

  // crown
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.moveTo(x-60,y-30);
  ctx.lineTo(x,y-125);
  ctx.lineTo(x+60,y-30);
  ctx.closePath(); ctx.fill();

  face(x,y,"#b7c56b");

  // exoskeleton
  rect(x-50,y+55,100,180,"#3d7a4f");

  // bio spots
  for(let i=0;i<14;i++){
    circle(x-40+Math.random()*80,y+80+Math.random()*130,4,"#111");
  }
}

/* ===== GOKU ===== */
function goku(x,y){
  arms(x,y,"#f2c9a5");
  legs(x,y,"#ff7a18");

  // hair
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.moveTo(x-70,y-20);
  ctx.lineTo(x-35,y-120);
  ctx.lineTo(x,y-75);
  ctx.lineTo(x+35,y-125);
  ctx.lineTo(x+70,y-20);
  ctx.closePath(); ctx.fill();

  face(x,y,"#f2c9a5");

  // gi
  rect(x-50,y+55,100,180,"#ff7a18");
  rect(x-50,y+135,100,14,"#2346ff");
}

/* ===== PICCOLO ===== */
function piccolo(x,y){
  arms(x,y,"#3fa85d");
  legs(x,y,"#3fa85d");

  // antenna
  ctx.strokeStyle="#3fa85d";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(x-18,y-55); ctx.lineTo(x-30,y-110);
  ctx.moveTo(x+18,y-55); ctx.lineTo(x+30,y-110);
  ctx.stroke();

  face(x,y,"#3fa85d");

  // cloak
  rect(x-75,y+45,150,200,"#eee");
  rect(x-45,y+80,90,160,"#5b3a8e");
}

/* ===== DRAW ALL ===== */
gohan(200,240);
a16(500,240);
cell(800,240);
goku(1100,240);
piccolo(1400,240);
</script>

</body>
</html>
