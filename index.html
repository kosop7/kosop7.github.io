<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Dragon Ball Canvas Characters</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #111 0%, #000 70%);
    color: #fff;
    font-family: system-ui, sans-serif;
  }
  h1 {
    text-align: center;
    margin: 16px 0 6px;
    letter-spacing: 1px;
  }
  p {
    text-align: center;
    margin-bottom: 16px;
    opacity: 0.6;
    font-size: 13px;
  }
  canvas {
    display: block;
    margin: 0 auto 24px;
    background: linear-gradient(#050505, #0e0e0e);
    border-radius: 16px;
    box-shadow:
      0 0 50px rgba(0,200,150,0.15),
      inset 0 0 40px rgba(255,255,255,0.03);
  }
</style>
</head>
<body>

<h1>DRAGON BALL – FULL BODY STUDY</h1>
<p>Neutral Expression · Full Limbs · High Detail Canvas</p>

<canvas id="canvas" width="1500" height="900"></canvas>

<script>
const c = document.getElementById("canvas");
const ctx = c.getContext("2d");

/* ========== UTIL ========== */
function circle(x,y,r,color){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
}

/* ========== LIMB SET ========== */
function arms(x,y,skin){
  ctx.fillStyle=skin;
  ctx.fillRect(x-80,y+80,35,110); // left
  ctx.fillRect(x+45,y+80,35,110); // right
}
function legs(x,y,pants){
  ctx.fillStyle=pants;
  ctx.fillRect(x-35,y+200,30,120);
  ctx.fillRect(x+5,y+200,30,120);
}

/* ========== GOHAN ========== */
function gohan(x,y){
  arms(x,y,"#f2c9a5");
  legs(x,y,"#3d2566");

  circle(x,y,55,"#f2c9a5");

  ctx.fillStyle="#000"; // neutral eyes
  ctx.fillRect(x-18,y-5,10,6);
  ctx.fillRect(x+8,y-5,10,6);

  ctx.fillStyle="#000"; // hair
  ctx.beginPath();
  ctx.moveTo(x-60,y-30);
  ctx.lineTo(x-20,y-110);
  ctx.lineTo(x,y-70);
  ctx.lineTo(x+20,y-115);
  ctx.lineTo(x+60,y-30);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#5b3a8e"; // body
  ctx.fillRect(x-45,y+55,90,150);
}

/* ========== ANDROID 16 ========== */
function a16(x,y){
  arms(x,y,"#e8e8e8");
  legs(x,y,"#2a2a2a");

  circle(x,y,55,"#e8e8e8");

  ctx.fillStyle="#000";
  ctx.fillRect(x-20,y-6,12,5);
  ctx.fillRect(x+8,y-6,12,5);

  ctx.fillStyle="#ff7a00";
  ctx.fillRect(x-60,y-85,120,30);

  ctx.fillStyle="#4f6f2f";
  ctx.fillRect(x-50,y+55,100,160);
}

/* ========== CELL ========== */
function cell(x,y){
  arms(x,y,"#3d7a4f");
  legs(x,y,"#2e5c3e");

  circle(x,y,55,"#b7c56b");

  ctx.fillStyle="#000"; // crown
  ctx.beginPath();
  ctx.moveTo(x-60,y-35);
  ctx.lineTo(x,y-120);
  ctx.lineTo(x+60,y-35);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#000";
  ctx.fillRect(x-22,y-4,16,5);
  ctx.fillRect(x+6,y-4,16,5);

  ctx.fillStyle="#3d7a4f";
  ctx.fillRect(x-50,y+55,100,160);

  ctx.fillStyle="#111"; // spots
  for(let i=0;i<12;i++){
    circle(x-35+Math.random()*70,y+70+Math.random()*130,5,"#111");
  }
}

/* ========== GOKU ========== */
function goku(x,y){
  arms(x,y,"#f2c9a5");
  legs(x,y,"#ff7a18");

  circle(x,y,55,"#f2c9a5");

  ctx.fillStyle="#000";
  ctx.fillRect(x-18,y-5,10,6);
  ctx.fillRect(x+8,y-5,10,6);

  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.moveTo(x-70,y-20);
  ctx.lineTo(x-40,y-110);
  ctx.lineTo(x,y-70);
  ctx.lineTo(x+40,y-120);
  ctx.lineTo(x+70,y-20);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#ff7a18";
  ctx.fillRect(x-50,y+55,100,160);
}

/* ========== PICCOLO ========== */
function piccolo(x,y){
  arms(x,y,"#3fa85d");
  legs(x,y,"#3fa85d");

  circle(x,y,55,"#3fa85d");

  ctx.strokeStyle="#3fa85d";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(x-20,y-60); ctx.lineTo(x-30,y-105);
  ctx.moveTo(x+20,y-60); ctx.lineTo(x+30,y-105);
  ctx.stroke();

  ctx.fillStyle="#000";
  ctx.fillRect(x-18,y-5,10,6);
  ctx.fillRect(x+8,y-5,10,6);

  ctx.fillStyle="#eee";
  ctx.fillRect(x-70,y+50,140,180);

  ctx.fillStyle="#5b3a8e";
  ctx.fillRect(x-40,y+80,80,140);
}

/* ========== DRAW ========== */
gohan(200,220);
a16(480,220);
cell(760,220);
goku(1040,220);
piccolo(1320,220);
</script>

</body>
</html>
