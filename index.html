<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대한민국 새 도감</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== 전체 ===== */
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: "Noto Serif KR", serif;
  height: 100%;
}

/* ===== 무조건 정중앙 스테이지 ===== */
#book-stage {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== 책 ===== */
#book {
  width: 900px;
  height: 560px;
  display: flex;
  background: #4a3628;
  padding: 14px;
  border-radius: 6px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}

/* ===== 페이지 ===== */
.page {
  width: 50%;
  background: #fbf8f2;
  padding: 26px;
  overflow: hidden;
}

.page.left {
  border-right: 1px solid #d6cfc4;
}

.page.right {
  border-left: 1px solid #d6cfc4;
}

/* ===== 표지 ===== */
.cover {
  background: #4a3628;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.cover h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

/* ===== 텍스트 ===== */
.title {
  font-size: 22px;
  font-weight: bold;
  color: #3b2a1a;
}

.sci {
  font-style: italic;
  font-size: 14px;
  color: #6b5a4a;
  margin-bottom: 14px;
}

.desc {
  font-size: 15px;
  line-height: 1.7;
  color: #3b2a1a;
}

/* ===== 잠금 ===== */
.locked {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #8b7a6a;
}

.locked span {
  font-size: 60px;
  margin-bottom: 12px;
}

/* ===== 사진 ===== */
input[type=file] {
  margin-bottom: 10px;
}

.photos {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.photos img {
  width: 120px;
  height: 90px;
  object-fit: cover;
  border: 1px solid #b6a999;
}

/* ===== 네비게이션 ===== */
#nav {
  margin-top: 16px;
}

#nav button {
  background: none;
  border: none;
  font-size: 28px;
  margin: 0 24px;
  cursor: pointer;
  color: #4a3628;
  opacity: 0.55;
}

#nav button:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div id="book-stage">
  <div id="book"></div>

  <div id="nav">
    <button onclick="prev()">‹</button>
    <button onclick="next()">›</button>
  </div>
</div>

<script>
const data = [
  { type: "cover" },
  { type: "guide" },

  {
    id: "sparrow",
    name: "참새",
    sci: "Passer montanus",
    unlocked: true,
    desc: "대한민국 전역에서 가장 흔히 관찰되는 소형 조류."
  },
  {
    id: "crow",
    name: "까마귀",
    sci: "Corvus corone",
    unlocked: true,
    desc: "높은 지능과 적응력을 가진 대형 조류."
  },
  {
    id: "pigeon",
    name: "비둘기",
    sci: "Columba livia",
    unlocked: true,
    desc: "도시 환경에 잘 적응한 새."
  },
  {
    id: "eagle",
    name: "독수리",
    sci: "Aquila chrysaetos",
    unlocked: false
  }
];

let index = 0;
const book = document.getElementById("book");

function photos(id) {
  return JSON.parse(localStorage.getItem("p_" + id) || "[]");
}

function save(id, src) {
  const arr = photos(id);
  arr.push(src);
  localStorage.setItem("p_" + id, JSON.stringify(arr));
}

function render() {
  book.innerHTML = "";
  book.append(makePage(data[index], "left"));
  book.append(makePage(data[index + 1], "right"));
}

function makePage(d, side) {
  const p = document.createElement("div");
  p.className = `page ${side}`;

  if (!d) return p;

  if (d.type === "cover") {
    p.classList.add("cover");
    p.innerHTML = "<h1>대한민국 새 도감</h1><p>나만의 기록형 도감</p>";
    return p;
  }

  if (d.type === "guide") {
    p.innerHTML = "<div class='title'>사용법</div><div class='desc'>새를 만나면 기록하세요.</div>";
    return p;
  }

  if (side === "left") {
    p.innerHTML = `
      <div class="title">${d.name}</div>
      <div class="sci">${d.sci}</div>
      <div class="desc">${d.desc || ""}</div>
    `;
  } else {
    if (!d.unlocked) {
      p.innerHTML = `<div class="locked"><span>🔒</span>미발견</div>`;
    } else {
      const imgs = photos(d.id);
      p.innerHTML = `<input type="file" accept="image/*"><div class="photos"></div>`;
      const grid = p.querySelector(".photos");

      imgs.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        grid.appendChild(img);
      });

      p.querySelector("input").onchange = e => {
        const r = new FileReader();
        r.onload = () => { save(d.id, r.result); render(); };
        r.readAsDataURL(e.target.files[0]);
      };
    }
  }

  return p;
}

function next() {
  if (index < data.length - 2) {
    index += 2;
    render();
  }
}

function prev() {
  if (index > 0) {
    index -= 2;
    render();
  }
}

render();
</script>

</body>
</html>
