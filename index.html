<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clumsy Bird</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    /* ===== 게임 영역 ===== */
    .game-wrap {
      padding: 40px 0 60px;
      background: #ffffff;
    }

    .game-inner {
      position: relative;
      max-width: 420px;
      margin: 0 auto;
    }

    #game {
      display: block;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .ui {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #222;
      font-weight: 800;
      pointer-events: none;
    }

    #score {
      top: 14px;
      font-size: 36px;
    }

    #hint {
      bottom: 18%;
      font-size: 15px;
      opacity: .6;
    }

    #over {
      top: 38%;
      font-size: 26px;
      display: none;
      text-align: center;
    }

    #over small {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      opacity: .6;
    }

    /* ===== 포스트 ===== */
    .c-archives {
      max-width: 720px;
      margin: 80px auto;
      padding: 0 20px;
    }
  </style>
</head>

<body>

<!-- GAME -->
<section class="game-wrap">
  <div class="game-inner">
    <canvas id="game"></canvas>
    <div id="score" class="ui">0</div>
    <div id="hint" class="ui">탭 / 클릭 / 스페이스</div>
    <div id="over" class="ui">
      GAME OVER
      <small>다시 시작: 탭 / 클릭 / 스페이스</small>
    </div>
  </div>
</section>

<!-- POSTS -->
<section class="c-archives">
  <ul class="c-archives__list">
    {% for post in site.posts %}
      <li class="c-archives__item">
        <h3>
          <a href="{{ post.url | prepend: site.baseurl }}">
            {{ post.title }}
          </a>
        </h3>
      </li>
    {% endfor %}
  </ul>
</section>

<script>
/* ===== Canvas ===== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const GAME_WIDTH = 420;
const GAME_HEIGHT = 640;

function resize() {
  canvas.style.width = GAME_WIDTH + 'px';
  canvas.style.height = GAME_HEIGHT + 'px';
  canvas.width = GAME_WIDTH * DPR;
  canvas.height = GAME_HEIGHT * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();

/* ===== 난이도 (관대함 유지) ===== */
const GRAVITY = 0.45;
const FLAP = -8.5;
const PIPE_GAP = 160;
const PIPE_W = 60;
const PIPE_SPEED = 1.9;
const GROUND_H = 90;

/* ===== 상태 ===== */
let running = false;
let gameOver = false;
let score = 0;

const bird = {
  x: 90,
  y: GAME_HEIGHT / 2,
  r: 10,
  vy: 0,
  rot: 0
};

let pipes = [];
let spawnTimer = 0;

/* ===== UI ===== */
const scoreEl = document.getElementById('score');
const hintEl = document.getElementById('hint');
const overEl = document.getElementById('over');

/* ===== 입력 ===== */
function flap() {
  if (!running) {
    reset();
    running = true;
    hintEl.style.display = 'none';
    return;
  }
  if (gameOver) {
    reset();
    return;
  }
  bird.vy = FLAP;
}

window.addEventListener('keydown', e => e.code === 'Space' && flap());
window.addEventListener('mousedown', flap);
window.addEventListener('touchstart', e => {
  e.preventDefault();
  flap();
}, { passive: false });

/* ===== 유틸 ===== */
const rand = (a, b) => Math.random() * (b - a) + a;

function reset() {
  gameOver = false;
  running = true;
  score = 0;
  scoreEl.textContent = score;
  overEl.style.display = 'none';
  bird.y = GAME_HEIGHT / 2;
  bird.vy = 0;
  pipes = [];
  spawnTimer = 0;
}

function addPipe() {
  pipes.push({
    x: GAME_WIDTH + 20,
    gapY: rand(150, GAME_HEIGHT - GROUND_H - 150),
    passed: false
  });
}

/* ===== 관대한 충돌 ===== */
function collidePipe(p) {
  const r = bird.r;
  const margin = 6;
  const topH = p.gapY - PIPE_GAP / 2;
  const botY = p.gapY + PIPE_GAP / 2;

  if (bird.x + r > p.x + margin &&
      bird.x - r < p.x + PIPE_W - margin) {
    if (bird.y - r < topH + margin ||
        bird.y + r > botY - margin) {
      return true;
    }
  }
  return false;
}

/* ===== 그리기 ===== */
function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  ctx.fillStyle = '#ffdf3a';
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff9f1a';
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(22, -4);
  ctx.lineTo(22, 4);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(-4, -4, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawPipes() {
  ctx.fillStyle = '#2ecc71';
  pipes.forEach(p => {
    const topH = p.gapY - PIPE_GAP / 2;
    const botY = p.gapY + PIPE_GAP / 2;
    ctx.fillRect(p.x, 0, PIPE_W, topH);
    ctx.fillRect(p.x, botY, PIPE_W, GAME_HEIGHT - botY - GROUND_H);
  });
}

function drawGround() {
  ctx.fillStyle = '#dddddd';
  ctx.fillRect(0, GAME_HEIGHT - GROUND_H, GAME_WIDTH, GROUND_H);
}

/* ===== 업데이트 ===== */
function update() {
  if (!running || gameOver) return;

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.max(-0.4, Math.min(1.2, bird.vy / 12));

  if (bird.y < 6 || bird.y > GAME_HEIGHT - GROUND_H - 6) {
    gameOver = true;
  }

  spawnTimer++;
  if (spawnTimer > 120) {
    addPipe();
    spawnTimer = 0;
  }

  pipes.forEach(p => {
    p.x -= PIPE_SPEED;

    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }

    if (collidePipe(p)) gameOver = true;
  });

  pipes = pipes.filter(p => p.x + PIPE_W > -20);

  if (gameOver) {
    overEl.style.display = 'block';
    running = false;
  }
}

/* ===== 루프 ===== */
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPipes();
  drawGround();
  drawBird();
  update();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
