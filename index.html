---
layout: page
title: Home
---

<style>
#book-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 80px 0;
}

#book {
  width: 900px;
  height: 560px;
  display: flex;
  background: #4a3628;
  padding: 14px;
  border-radius: 6px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}

.page {
  width: 50%;
  background: #fbf8f2;
  padding: 26px;
  box-sizing: border-box;
}

.page.left { border-right: 1px solid #d6cfc4; }
.page.right { border-left: 1px solid #d6cfc4; }

.cover {
  background: #4a3628;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 36px;
  letter-spacing: 3px;
}

.title {
  font-size: 22px;
  font-weight: bold;
  color: #3b2a1a;
}

.sci {
  font-style: italic;
  font-size: 14px;
  color: #6b5a4a;
  margin-bottom: 12px;
}

.desc {
  font-size: 15px;
  line-height: 1.7;
  color: #3b2a1a;
  white-space: pre-line;
}

.placeholder {
  width: 100%;
  height: 100%;
  border: 2px dashed #c8bfb3;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #9a8f82;
  font-size: 16px;
}

.small-photo {
  width: 180px;
  height: 120px;
  object-fit: cover;
  border: 1px solid #b6a999;
  margin: 10px 0;
}

.full-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#audio {
  margin-top: 12px;
}

#nav {
  margin-top: 16px;
}

#nav button {
  background: none;
  border: none;
  font-size: 28px;
  margin: 0 24px;
  cursor: pointer;
  color: #4a3628;
}
</style>

<div id="book-stage">
  <div id="book"></div>

  <div id="nav">
    <button onclick="prev()">‹</button>
    <button onclick="next()">›</button>
  </div>
</div>

<script>
const pages = [
  // p.1 표지 (오른쪽만)
  { type: "cover-right" },

  // p.2 / p.3
  { type: "photo-placeholder" },
  { type: "guide" },

  // p.4 / p.5
  { type: "sparrow-info" },
  { type: "sparrow-photo" }
];

let index = 0;
const book = document.getElementById("book");

function render() {
  book.innerHTML = "";

  // 표지는 오른쪽만
  if (pages[index].type === "cover-right") {
    const blank = document.createElement("div");
    blank.className = "page left";
    book.append(blank);

    const cover = document.createElement("div");
    cover.className = "page right cover";
    cover.textContent = "새 도감";
    book.append(cover);
    return;
  }

  book.append(makePage(pages[index], "left"));
  book.append(makePage(pages[index + 1], "right"));
}

function makePage(p, side) {
  const d = document.createElement("div");
  d.className = `page ${side}`;

  if (!p) return d;

  if (p.type === "photo-placeholder") {
    d.innerHTML = `<div class="placeholder">사진 추가 예정</div>`;
  }

  if (p.type === "guide") {
    d.innerHTML = `<div class="title">만나면 채워짐</div>`;
  }

  if (p.type === "sparrow-info") {
    d.innerHTML = `
      <div class="title">참새</div>
      <div class="sci">Passer montanus</div>
      <img src="assets/images/b1.jpg" class="small-photo">

      <div class="desc">
참새는 참새목 참새과에 속하는 소형 텃새로,
대한민국 전역에서 가장 흔히 관찰된다.

몸길이는 약 14cm이며,
뺨의 검은 반점이 특징이다.
곡식과 풀씨를 먹고 여름에는 해충을 잡아먹는다.
      </div>

      <div id="audio">
        <audio controls style="width:100%">
          <source src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Passer_montanus.ogg">
        </audio>
      </div>
    `;
  }

  if (p.type === "sparrow-photo") {
    d.innerHTML = `<img src="assets/images/b2.jpg" class="full-photo">`;
  }

  return d;
}

function next() {
  if (index < pages.length - 1) {
    index += 2;
    render();
  }
}

function prev() {
  if (index > 0) {
    index -= 2;
    render();
  }
}

render();
</script>
