    html, body {

    .ui {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #222;
      font-weight: 800;

    }

    #score {

      font-size: 34px;
    }

    #hint {

      font-size: 14px;
      opacity: .6;
    }

    #over {
      top: 38%;
      font-size: 26px;
      display: none;
      text-align: center;
    }

    #over small {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      opacity: .6;
    }

    /* ===== 포스트 ===== */
    .c-archives {
      max-width: 720px;
      margin: 80px auto;
      padding: 0 20px;
    }
  </style>
</head>
