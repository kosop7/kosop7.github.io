<footer class="c-page__footer">

  <script>
    window.onload = function() {
      const fortunes = [
        "바르샤바에 있는 레닌에 대한 유명한 농담이 있다. 모스크바에서 열린 한 미술 전시회에 레닌의 부인이 공산당 청년동맹의 단원과 침대에 함께 있는 그림이 전시되었다. 가이드는 근엄한 표정을 지으며 '레닌은 바르샤바에 있습니다.'라고 대답했다.",

        "지젝은 말한다. 예수는 '너희 중 죄 없는 자가 먼저 돌을 던져라'고 했다. 마르크스는 '돌은 이미 체계적으로 배분되어 있다'고 했다.",

        "어느 교수와 학생이 대화 중이다. 교수: '나는 진리를 추구한다.' 학생: '그럼 진리는 무엇인가요?' 교수: '진리는 내가 추구하는 것입니다.'",

      showRandomFortune();
      setInterval(showRandomFortune, 5000);
