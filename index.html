<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Bird Map KR</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body{ margin:0; padding:0; height:100%; }
    #map{ width:100%; height:100%; }
    #infoBox {
      position: absolute;
      z-index: 999;
      top: 10px; left: 10px;
      background: white;
      padding: 8px 12px;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 14px;
      max-width: 220px;
    }
  </style>
</head>

<body>
<div id="map"></div>
<div id="infoBox">지역을 클릭하세요</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// 1) 새 기록 데이터
const birdsData = {
  "강서구": [ { name:"비둘기", date:"2026-02-01", note:"한강 근처" } ],
  "의왕시": [ { name:"물까치", date:"2026-01-20", note:"왕송호수" } ]
};

// 2) 지도 초기화
const map = L.map("map").setView([36.5, 127.8], 7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap"
}).addTo(map);

// 3) 클릭된 구 정보 표시
const infoBox = document.getElementById("infoBox");
function showInfo(name){
  const rec = birdsData[name];
  if(!rec){
    infoBox.innerHTML = name + " — 기록 없음";
  } else {
    let html = `<b>${name}</b><br>`;
    rec.forEach(r=>{
      html += `${r.name} (${r.date})<br>`;
    });
    infoBox.innerHTML = html;
  }
}

// 4) GeoJSON 불러오기 (정확한 파일 경로)
fetch("https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-geo.json")
  .then(res=>res.json())
  .then(data=>{
    L.geoJSON(data, {
      style: f=>({
        fillColor: birdsData[f.properties.Name] ? "#2a9df4" : "#ccc",
        color:"#666", weight:1, fillOpacity:0.6
      }),
      onEachFeature: (feature, layer)=>{
        const name = feature.properties.Name;
        layer.on({
          click: ()=> showInfo(name),
          mouseover: ()=> layer.setStyle({fillOpacity:0.9}),
          mouseout: ()=> layer.setStyle({fillOpacity:0.6})
        });
      }
    }).addTo(map);
  });

</script>
</body>
</html>
