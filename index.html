<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Bird Map Game</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background: #f5f5f5;
  }

  #container {
    display: flex;
    height: 100vh;
  }

  #map {
    width: 70%;
    background: #eaeaea;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #panel {
    width: 30%;
    padding: 16px;
    background: #ffffff;
    border-left: 1px solid #ccc;
  }

  h2 {
    margin-top: 0;
    font-size: 18px;
  }

  .region {
    fill: #cfcfcf;
    stroke: #666;
    stroke-width: 1;
    cursor: pointer;
    transition: fill 0.2s;
  }

  .region:hover {
    fill: #9fdacb;
  }

  .visited {
    fill: #00c896;
  }

  .empty {
    opacity: 0.6;
  }
</style>
</head>

<body>

<div id="container">

  <!-- =======================
       SVG 지도 (단순화 버전)
       ======================= -->
  <div id="map">
    <svg viewBox="0 0 400 600" width="90%" height="90%">

      <!-- 강서구 (예시) -->
      <path id="강서구" class="region"
        d="M120 80 L180 80 L180 140 L120 140 Z" />

      <!-- 의왕시 (예시) -->
      <path id="의왕시" class="region"
        d="M200 180 L260 180 L260 240 L200 240 Z" />

      <!-- 나중에 여기 계속 추가 -->
    </svg>
  </div>

  <!-- =======================
       정보 패널
       ======================= -->
  <div id="panel">
    <h2>지역 선택</h2>
    <p class="empty">지도에서 지역을 클릭하세요</p>
  </div>

</div>

<script>
/* =======================
   새 기록 데이터
======================= */
const birdsData = {
  "강서구": [
    { name: "비둘기", date: "2026-02-01", note: "한강 근처" }
  ],
  "의왕시": [
    { name: "물까치", date: "2026-01-20", note: "왕송호수" }
  ]
};

const panel = document.getElementById("panel");

/* =======================
   지역 클릭 처리
======================= */
document.querySelectorAll(".region").forEach(region => {
  const name = region.id;

  if (birdsData[name]) {
    region.classList.add("visited");
  }

  region.addEventListener("click", () => {
    showInfo(name);
  });
});

function showInfo(region) {
  const list = birdsData[region];

  if (!list) {
    panel.innerHTML = `
      <h2>${region}</h2>
      <p class="empty">이 지역의 기록 없음</p>
    `;
    return;
  }

  let html = `<h2>${region}</h2><ul>`;
  list.forEach(b => {
    html += `
      <li>
        <b>${b.name}</b> (${b.date})<br>
        <small>${b.note}</small>
      </li>
    `;
  });
  html += `</ul>`;

  panel.innerHTML = html;
}
</script>

</body>
</html>
