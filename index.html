<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SSJ2 Handoban Ultimate – Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<style>
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}
canvas{display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;gap:10px;align-items:center}
#hint{opacity:.85;font-size:13px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div id="hint">화면 아무 곳이나 탭하여 진행</div></div>
<script>
// ====== Canvas Setup ======
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}addEventListener('resize',resize);resize();

// ====== Global State ======
let scene=0,t=0,shake=0,slowFrames=0;
let energy=0,awakened=false;
let flags = {sky:'dark'}; // <-- 초기값 설정
const SCALE=1.35;
const cx=()=>canvas.width/2;
const cy=()=>canvas.height*0.76;

// ====== Utilities ======
function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }
function lerp(a,b,k){ return a+(b-a)*k; }

// ====== Input ======
function next(){ scene=Math.min(scene+1, SCENES.length-1); t=0; vibrate(scene===4?[120,40,120,40,180]:25); }
canvas.addEventListener('touchstart',e=>{e.preventDefault();next();},{passive:false});
canvas.addEventListener('click',()=>next());

// ====== Background & Effects ======
function bg(){ 
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,flags.sky==='red'?'#800000':'#0a0b1c');
  g.addColorStop(1,flags.sky==='red'?'#400000':'#000');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height); 
}
function lightning(intensity=1){
  ctx.strokeStyle='rgba(200,220,255,.95)'; ctx.lineWidth=2;
  const n=Math.ceil(intensity*3);
  for(let k=0;k<n;k++){
    ctx.beginPath();
    let x=cx()+Math.sin(t*2+k)*120,y=0;
    ctx.moveTo(x,y);
    while(y<canvas.height){
      x+=(Math.random()-.5)*50; y+=Math.random()*45+25; ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}
function aura(r,alpha){
  ctx.beginPath();
  ctx.arc(cx(),cy(),r+(Math.sin(t*2)*10),0,Math.PI*2);
  ctx.fillStyle=`rgba(255,215,0,${alpha})`; ctx.fill();
}

// ====== Character: Clothing (Gohan Gi) ======
function drawGi(){
  ctx.fillStyle='#5a2c83'; ctx.fillRect(cx()-30, cy()-96, 60, 62);
  ctx.fillStyle='#2c6fd6'; ctx.fillRect(cx()-34, cy()-34, 68, 12);
  ctx.fillStyle='#5a2c83'; ctx.fillRect(cx()-28, cy()-22, 22, 42);
  ctx.fillRect(cx()+6,  cy()-22, 22, 42);
  ctx.fillStyle='#e0c28b'; ctx.fillRect(cx()-30, cy()+18, 26, 12);
  ctx.fillRect(cx()+4,  cy()+18, 26, 12);
  ctx.fillStyle='#1f4fb8'; ctx.fillRect(cx()-30, cy()+30, 26, 8);
  ctx.fillRect(cx()+4,  cy()+30, 26, 8);
}

// ====== Character: Head ======
function head(anger=0,ssj2=false){
  ctx.beginPath();
  ctx.ellipse(cx(), cy()-108, 18, 22, 0, 0, Math.PI*2);
  ctx.fillStyle='#f1c27d'; ctx.fill();

  // 눈썹
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx()-10, cy()-116-anger); ctx.lineTo(cx()-2, cy()-118-anger);
  ctx.moveTo(cx()+2, cy()-118-anger); ctx.lineTo(cx()+10, cy()-116-anger);
  ctx.stroke();

  // 눈 흰자+홍채+동공
  ctx.fillStyle= ssj2?'#00f':'#000';
  ctx.beginPath(); ctx.ellipse(cx()-6,cy()-108,3,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx()+6,cy()-108,3,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(cx()-6,cy()-108,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx()+6,cy()-108,1.5,0,Math.PI*2); ctx.fill();

  // 눈물
  ctx.strokeStyle='rgba(0,150,255,0.8)';
  ctx.beginPath(); ctx.moveTo(cx()-6,cy()-104); ctx.lineTo(cx()-6,cy()-98); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx()+6,cy()-104); ctx.lineTo(cx()+6,cy()-98); ctx.stroke();

  // 코
  ctx.strokeStyle='#e0b080';
  ctx.beginPath(); ctx.moveTo(cx(),cy()-106); ctx.lineTo(cx(),cy()-102); ctx.stroke();

  // 입
  ctx.strokeStyle='#900';
  ctx.beginPath(); ctx.moveTo(cx()-5, cy()-96); ctx.lineTo(cx()+5, cy()-96); ctx.stroke();

  // 혈흔
  if(ssj2){
    ctx.strokeStyle='red';
    ctx.beginPath();
    ctx.moveTo(cx()-4,cy()-120); ctx.lineTo(cx()-6,cy()-108); ctx.stroke();
  }
}

// ====== Hair ======
function hair(ssj2=false){
  ctx.fillStyle=ssj2?'#ffd700':'#111';
  const by=cy()-138;
  const spikes=[
    [-26,by+28,-8, by-34, 6, by+26],
    [-10,by+26, 0, by-60, 10, by+26],
    [8,by+26, 22, by-42, 34, by+30]
  ];
  spikes.forEach(s=>{
    ctx.beginPath();
    ctx.moveTo(cx()+s[0],s[1]);
    ctx.lineTo(cx()+s[2],s[3]);
    ctx.lineTo(cx()+s[4],s[5]);
    ctx.closePath(); ctx.fill();
  });
}

// ====== Caption ======
function caption(text){ ctx.save(); ctx.globalAlpha=.94; ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0, canvas.height-130, canvas.width, 130); ctx.fillStyle='#fff'; ctx.font='15px system-ui'; ctx.textAlign='center'; wrap(text, canvas.width/2, canvas.height-92, canvas.width-40, 22); ctx.restore(); }
function wrap(text,x,y,w,l){ const words=text.split(' '); let line=''; let yy=y; for(let i=0;i<words.length;i++){ const test=line+words[i]+' '; if(ctx.measureText(test).width>w){ ctx.fillText(line,x,yy); line=words[i]+' '; yy+=l; } else line=test; } ctx.fillText(line,x,yy); }

// ====== Scenes ======
const SCENES=[
  { run(){ flags.sky='dark'; draw(false,0,0); caption('오반\n내가 좋아했던'); } },
  { run(){ draw(false,0,0); caption('오반\n자연과 동물들을'); } },
  { run(){ draw(false,0,0); caption('오반\n지.켜.주.거.라.'); } },
  { run(){ draw(false,0,0); caption('오반\n부탁한다~'); } },
  { run(){ flags.sky='red'; awakened=true; draw(true,.4,2); lightning(2.5); caption('초사이어인 2. 황금빛 오라와 번개가 전장을 뒤덮는다.'); } },
  { run(){ draw(true,.36,1); caption('손오공\n오반!'); } },
  { run(){ draw(true,.36,1); caption('피콜로\n드디어… 오반의 분노의 한계가 넘은 것인가?'); } }
];

// ====== Draw ======
function draw(ssj2=false,auraAlpha=0,anger=0){
  ctx.clearRect(0,0,canvas.width,canvas.height); // <-- 필수: 화면 초기화
  ctx.save();
  ctx.scale(SCALE,SCALE);
  if(shake) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  if(ssj2) aura(160,auraAlpha);
  drawGi();
  head(anger,ssj2);
  hair(ssj2);
  ctx.restore();
}

// ====== Loop ======
(function loop(){
  if(slowFrames>0){ slowFrames--; setTimeout(loop,40); return; }
  t+=0.016;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  SCENES[scene].run();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
