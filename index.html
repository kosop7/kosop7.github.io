<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>각성</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  background:#05060a;
  overflow:hidden;
  color:#fff;
  font-family:sans-serif;
}
canvas,svg{
  position:absolute;
  inset:0;
}
#ui{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  height:10px;
  background:#222;
}
#rage{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#555,#ffd400);
}
#subtitle{
  position:fixed;
  bottom:60px;
  width:100%;
  text-align:center;
  font-size:18px;
  letter-spacing:2px;
  opacity:0;
  transition:opacity 0.6s;
}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<svg id="gohan" viewBox="0 0 300 600">
  <!-- Hair -->
  <path id="hair"
    d="M70 90 L110 20 L150 80 L190 20 L230 90 L210 150 L90 150 Z"
    fill="#111"/>

  <!-- Face -->
  <ellipse cx="150" cy="150" rx="45" ry="55" fill="#f2c9a0"/>

  <!-- Brows -->
  <line id="bl" x1="120" y1="130" x2="145" y2="130" stroke="#111" stroke-width="4"/>
  <line id="br" x1="155" y1="130" x2="180" y2="130" stroke="#111" stroke-width="4"/>

  <!-- Eyes -->
  <ellipse id="el" cx="135" cy="145" rx="6" ry="3" fill="#111"/>
  <ellipse id="er" cx="165" cy="145" rx="6" ry="3" fill="#111"/>

  <!-- Tear -->
  <path id="tear" d="M135 150 C130 180 130 200 135 230"
        stroke="#8ecbff" stroke-width="2" fill="none" opacity="0"/>

  <!-- Bird -->
  <path id="bird"
    d="M-40 120 Q-20 110 0 120 Q20 110 40 120"
    stroke="#fff" stroke-width="2" fill="none"
    opacity="0"/>

  <!-- Body -->
  <path d="M90 210 L210 210 L240 350 L60 350 Z" fill="#f58220"/>
</svg>

<canvas id="glow"></canvas>

<div id="subtitle"></div>
<div id="ui"><div id="rage"></div></div>

<script>
const fx = document.getElementById("fx");
const ctx = fx.getContext("2d");
fx.width = innerWidth;
fx.height = innerHeight;

let rage = 0;
let shaking = false;
let speechDone = false;

const rageBar = document.getElementById("rage");
const el = document.getElementById("el");
const er = document.getElementById("er");
const tear = document.getElementById("tear");
const hair = document.getElementById("hair");
const subtitle = document.getElementById("subtitle");
const bird = document.getElementById("bird");

function updateFace(){
  tear.style.opacity = 0;
  if(rage<25){
    el.setAttribute("ry",3.5);
  }else if(rage<50){
    el.setAttribute("ry",2.5);
    tear.style.opacity=1;
  }else if(rage<75){
    el.setAttribute("ry",2);
  }else{
    el.setAttribute("ry",2);
    hair.setAttribute("fill","#ffd400");
    shaking=true;
  }

  if(rage>60 && !speechDone){
    triggerSpeech();
    speechDone=true;
  }
}

function triggerSpeech(){
  const lines=[
    `"자연과 동물들을"`,
    `"지.켜.주.거.라."`,
    `"부탁한다~"`
  ];

  let i=0;
  function next(){
    if(i>=lines.length){
      subtitle.style.opacity=0;
      return;
    }
    subtitle.textContent=lines[i];
    subtitle.style.opacity=1;

    if(i===1) flyBird();

    setTimeout(()=>{
      subtitle.style.opacity=0;
      i++;
      setTimeout(next,600);
    },1500);
  }
  next();
}

function flyBird(){
  let x=-40;
  bird.style.opacity=1;
  const fly=setInterval(()=>{
    x+=3;
    bird.setAttribute("transform",`translate(${x} 0)`);
    if(x>340){
      clearInterval(fly);
      bird.style.opacity=0;
    }
  },16);
}

function electric(){
  if(!shaking)return;
  ctx.clearRect(0,0,fx.width,fx.height);
  for(let i=0;i<4;i++){
    ctx.strokeStyle="rgba(255,220,0,0.7)";
    ctx.beginPath();
    ctx.moveTo(Math.random()*fx.width,0);
    ctx.lineTo(Math.random()*fx.width,fx.height);
    ctx.stroke();
  }
}

document.body.addEventListener("pointerdown",()=>{
  rage=Math.min(100,rage+4);
  rageBar.style.width=rage+"%";
  updateFace();
});

setInterval(()=>{
  rage=Math.max(0,rage-0.5);
  rageBar.style.width=rage+"%";
  updateFace();
},100);

function loop(){
  electric();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
